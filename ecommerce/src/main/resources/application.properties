spring.application.name=ecommerce
server.port=8080

# PostgreSQL (القيم من متغيرات البيئة؛ الافتراضي للتشغيل المحلي بدون Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: السر يجب أن يأتي من متغير بيئة في الإنتاج (32 حرف على الأقل)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
app.jwt.expiration-minutes=60

# حساب المسؤول الافتراضي (غيّر كلمة المرور عبر متغير البيئة)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# تحديد محاولات تسجيل الدخول
app.security.login.max-attempts=5
app.security.login.window-seconds=300

# تقسيم الصفحات
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# عدم كشف تفاصيل داخلية في الأخطاء
server.error.include-message=never
server.error.include-stacktrace=never

# رفع صور المنتجات (تُخزَّن على القرص داخل مجلد data المربوط بـ volume)
app.upload.dir=./data/uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
