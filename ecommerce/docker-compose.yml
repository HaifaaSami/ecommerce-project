services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  ecommerce:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # REST
    environment:
      DB_URL: "jdbc:postgresql://db:5432/ecommerce"
      DB_USER: "ecommerce"
      DB_PASSWORD: "ecommerce_pw"
      JWT_SECRET: "change-this-to-a-long-random-secret-at-least-32-chars"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Admin@12345"
    volumes:
      - uploads:/app/data   # صور المنتجات المرفوعة

volumes:
  pgdata:
  uploads:
